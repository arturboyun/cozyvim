# Собирает cozyvim под три платформы при пуше тега vX.Y.Z и складывает
# бинарники в релиз. Уроки встроены в бинарь, поэтому архив самодостаточен.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: cozyvim-x86_64-linux.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: cozyvim-aarch64-macos.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: cozyvim-x86_64-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # eframe тянет winit и системный GTK — на голом раннере их нет.
      - name: Системные зависимости (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Сборка
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Упаковка (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf "${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" cozyvim
      - name: Упаковка (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/cozyvim.exe" -DestinationPath "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Релиз мог быть заведён руками заранее — тогда просто дозаливаем файлы.
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "cozyvim $TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
