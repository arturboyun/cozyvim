id = "search/f-t"
chapter = "search"
order = 20

[text.ru]
title = "f и t: прицел внутри строки"
intro = """
Внутри строки w и l работают грубо: одно слишком крупно, другое слишком мелко.
f — find: прыжок на указанный символ. Нажал f, потом символ — курсор на нём.

t — till: встать вплотную перед символом. Разница в один шаг, но она решает,
что попадёт под оператор: dt) очистит скобку, df) съест и её.

Заглавные работают назад: F ищет символ левее курсора, T встаёт сразу за ним.
Все четыре живут только внутри текущей строки — это прицел, а не путешествие.
"""
[text.en]
title = "f and t: aiming inside a line"
intro = """
f jumps onto a character, t stops right before it. That one-step difference
decides what an operator takes. Capitals go backwards: F finds to the left,
T stops just after it. All four stay inside the current line.
"""

[[exercise]]
buffer = ["let value = compute(a, b);"]
cursor = [0, 0]
goal = ["let value = compute(a, b);"]
goal_cursor = [0, 19]
solutions = ["f("]
[exercise.text.ru]
task = "Прыгни на открывающую скобку."
hint = "f плюс сам символ. Считать столбцы не нужно."
[exercise.text.en]
task = "Jump onto the opening parenthesis."
hint = "f then the character itself."

[[exercise]]
